// ---------------------------------------------------------------- reading the guest list
const HEAD = {
  no: ['編號', '编号'], names: ['出行人姓名'], phones: ['出行人電話', '出行人电话'], pickup: ['上車點', '上车点'],
  dropoff: ['下車點', '下车点'], pax: ['人數', '人数'], rooms: ['房間數', '房间数'], tour: ['預定團號', '预定团号'],
  order: ['主訂單編號', '主订单编号'], depart: ['出發日期', '出发日期'], booked: ['預定日期', '预定日期'],
  paid: ['已付自費專案', '已付自费专案', '已付自費項目'], memo: ['主訂單操作員備忘', '主订单操作员备忘']
};

function readGuestList(rows, fileName) {
  rows = rows.map(r => (r || []).map(v => v === undefined || v === null ? '' : v));
  let h = rows.findIndex(r => r.some(v => HEAD.no.includes(str(v))) && r.some(v => HEAD.names.includes(str(v))));
  if (h < 0) throw new Error('找不到表頭（編號 / 出行人姓名）。這不是平常的名單格式。');
  const header = rows[h].map(str), col = {};
  for (const [k, names] of Object.entries(HEAD)) col[k] = header.findIndex(x => names.includes(x));
  // info rows above the header (original file): Tour Code / Departure Date / Tour Guide
  const info = {};
  rows.slice(0, h).forEach(r => {
    const a = str(r[0]).toLowerCase();
    const val = r.slice(1).map(str).find(Boolean) || '';
    if (a.includes('tour code')) info.tourCode = val;
    if (a.includes('departure')) info.date = val;
    if (a.includes('guide')) info.guide = val;
  });
  const bookings = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i], no = Number(str(r[col.no]));
    if (!Number.isFinite(no) || no <= 0 || str(r[col.no]) === '') continue;
    const get = k => col[k] >= 0 ? r[col[k]] : '';
    bookings.push({
      group: Math.round(no), names: str(get('names')), phonesRaw: numStr(get('phones')),
      pickupRaw: str(get('pickup')), dropoffRaw: str(get('dropoff')),
      pax: Math.round(Number(str(get('pax'))) || 0), rooms: str(get('rooms')).replace(/\.0$/, ''),
      tour: str(get('tour')), order: numStr(get('order')), paidRaw: str(get('paid')), memo: str(get('memo')),
      depart: str(get('depart'))
    });
  }
  if (!bookings.length) throw new Error('名單裡沒有任何組。');
  const tour = tourInfo(bookings, info, fileName || '');
  bookings.forEach(b => enrich(b, tour));
  return { tour, bookings, columns: header };
}

function parseDate(s) {
  if (!s) return null;
  let m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[1] - 1, +m[2]);
  return null;
}
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function familyOf(code) {
  code = (code || '').toUpperCase();
  if (/^(BAW|BACW|WVCR|YWVCR|BCW)/.test(code)) return 'WINTER';
  if (/^JSC/.test(code)) return 'JSC';
  if (/^JS/.test(code)) return 'JSA';
  if (/^BAC/.test(code)) return 'BAC';
  if (/^BA/.test(code)) return 'BAA';
  return null;
}

function tourInfo(bookings, info, fileName) {
  const counts = {};
  bookings.forEach(b => { const f = familyOf(b.tour); if (f) counts[b.tour] = (counts[b.tour] || 0) + b.pax; });
  let code = (info.tourCode || (fileName.match(/^([A-Z]+\d+)/i) || [])[1] || '').toUpperCase();
  if (!familyOf(code)) code = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || 'BAA4';
  const fam = familyOf(code);
  const kind = /^JS/.test(code) ? 'JS' : 'BA';
  const winter = fam === 'WINTER';
  const start = parseDate(fileName) || parseDate(info.date) || parseDate(bookings[0].depart) || new Date();
  const days = kind === 'JS' ? 5 : 4;
  return {
    code, kind, winter, days, start: ymd(start), fileName,
    dropDays: kind === 'JS' ? 3 : 2,                 // days a Calgary drop-off guest is with you
    icefieldDay: winter ? null : (kind === 'JS' ? 3 : 2),
    weatherDay: winter ? 2 : (kind === 'JS' ? 3 : 2),
    mealSchedule: kind === 'JS' ? { 1: 'LD', 2: 'BL', 3: '', 4: 'LD', 5: 'BL' }
      : winter ? { 1: 'LD', 2: 'BL', 3: 'D', 4: 'BL' } : { 1: 'LD', 2: 'B', 3: 'LD', 4: 'BL' }
  };
}

// count items like "必付項目: C$258 * 2"
function countItem(text, marker) {
  if (!text) return 0;
  const re = new RegExp(marker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^*【]*\\*\\s*(\\d+)', 'g');
  let n = 0, m; while ((m = re.exec(text))) n += +m[1]; return n;
}
const CHILD_WORDS = ['兒童', '儿童', '小孩', '孩童', 'child'];

function enrich(b, tour) {
  b.phones = [...b.phonesRaw.matchAll(/\((\d{1,3})\)\s*(\d{6,})/g)].map(m => '+' + m[1] + m[2]);
  b.warnings = [];
  if (!b.phones.length) {
    const d = b.phonesRaw.replace(/\D/g, '');
    if (d.length === 10) { b.phones = ['+1' + d]; b.warnings.push('電話沒有國碼，當作 +1'); }
    else if (b.phonesRaw) b.warnings.push('電話不明: ' + b.phonesRaw);
    else b.warnings.push('沒有電話');
  }
  b.nameList = b.names.split(/\s{2,}|\n/).map(s => s.trim()).filter(Boolean);
  b.stops = [...b.pickupRaw.replace(/\s+/g, ' ').matchAll(/\[(\d{2}:\d{2})\]\s*([^\[]*)/g)].map(m => ({ time: m[1], place: m[2].trim() }));
  const up_ = (b.pickupRaw + ' ' + b.dropoffRaw).toUpperCase();
  b.joinsCalgary = !b.stops.length && /CALGARY|卡爾加里|卡尔加里/.test(b.pickupRaw.toUpperCase());
  b.dropsCalgary = /CALGARY|卡爾加里|卡尔加里/.test(b.dropoffRaw.toUpperCase());
  b.role = b.joinsCalgary ? 'join' : b.dropsCalgary ? 'drop' : 'full';
  b.days = b.role === 'join' ? tour.days - tour.dropDays : b.role === 'drop' ? tour.dropDays : tour.days;
  if (b.stops.length > 1) b.warnings.push('有兩個上車點');
  if (!b.stops.length && !b.joinsCalgary) b.warnings.push('沒有上車時間');
  b.family = b.role === 'drop' ? (tour.winter ? 'WINTER' : 'DROP') : b.role === 'join' ? (tour.winter ? 'WINTER' : 'JOIN') : (familyOf(b.tour) || familyOf(tour.code));
  b.paidMandatory = countItem(b.paidRaw, '必付項目') + countItem(b.paidRaw, '必付项目');
  b.unpaid = b.paidMandatory === 0;
  b.preMeals = countItem(b.paidRaw, '餐費') + countItem(b.paidRaw, '餐费');
  b.prepaidService = countItem(b.paidRaw, '服務費') + countItem(b.paidRaw, '服务费');
  b.prepaidFuel = countItem(b.paidRaw, '交通附加費') + countItem(b.paidRaw, '交通附加费');
  b.childMentioned = CHILD_WORDS.some(w => (b.paidRaw + ' ' + b.memo + ' ' + b.names).toLowerCase().includes(w.toLowerCase()));
  b.paidChildren = countItem(b.paidRaw, '【兒童】') ;
  b.frontRowPaid = /front\s*row|前排|第一排/i.test(b.memo);
  b.wechat = (b.memo.match(/微信号?[:：]?\s*([A-Za-z0-9_\-]+)/) || [])[1] || '';
  b.unusualCode = !DEFAULT_SETTINGS.normalTourCodes.includes(b.tour.toUpperCase());
}

// ---------------------------------------------------------------- prices
function mandatoryPrice(b, s) {           // [adult, child] before GST
  const P = s.prices.mandatory;
  return P[b.family] || P[familyOf(b.tour)] || P.BAA;
}
function feeText(b, s, lang) {
  const [a, c] = mandatoryPrice(b, s), A = up(a * GST), C = up(c * GST);
  if (lang === 'en') return '$' + A + '/person' + (b.childMentioned ? ' (child $' + C + '/person)' : '');
  return '$' + A + '/人' + (b.childMentioned ? ' (兒童$' + C + '/人)' : '');
}
function mealDays(b, tour) {
  const d = Object.keys(tour.mealSchedule).map(Number);
  if (b.role === 'drop') return d.filter(x => x <= tour.dropDays);
  if (b.role === 'join') return d.filter(x => x > tour.dropDays);
  return d;
}
function mealPrice(b, tour, s) {          // [adult, child|null] with GST
  const P = s.prices;
  if (b.role === 'full') return P.mealFull[tour.kind];
  let a = 0; mealDays(b, tour).forEach(d => [...tour.mealSchedule[d]].forEach(m => a += P.mealPerMeal[m]));
  const child = (b.role === 'drop' && !tour.winter && tour.kind === 'BA') ? P.mealPartChildFirst2Summer : null;
  return [a, child];
}

// ---------------------------------------------------------------- pickups
function pickupLines(b, all, s, lang) {
  const allText = all.map(x => x.pickupRaw).join(' ').toLowerCase();
  return b.stops.map(st => {
    const rule = s.stops.find(r => r.keys.some(k => st.place.toLowerCase().includes(k.toLowerCase())));
    let time = st.time.replace(/^0/, ''), place = st.place;
    const notes = (st.place.match(/\([^()]*PAX[^()]*\)/g) || []).join(' ');
    if (rule) {
      place = (lang === 'en' ? rule.en : rule.zh) + (notes ? ' ' + notes : '');
      if (rule.time) time = rule.time;
      if (rule.timeIf) {
        const hit = (rule.timeIf.present || []).some(w => allText.includes(w.toLowerCase()));
        const miss = rule.timeIf.absent && !rule.timeIf.absent.some(w => allText.includes(w.toLowerCase()));
        if (hit || miss) time = rule.timeIf.time;
      }
    }
    return { time, place, surrey: !!(rule && rule.surrey) };
  });
}

// ---------------------------------------------------------------- language guess
function guessEnglish(b, s) {
  // only the phone number and the last name are used:
  // any China / Hong Kong / Macau / Taiwan number → Chinese
  if (b.phones.some(p => /^\+(86|852|853|886)/.test(p))) return false;
  // otherwise English when at least half the travellers have a last name that is not a Chinese surname
  const list = new Set((s.chineseSurnames || '').toLowerCase().split(/\s+/).filter(Boolean));
  const people = (b.nameList.length ? b.nameList : [b.names]).map(p => p.split('/')[0].trim()).filter(p => /[a-z]/i.test(p));
  if (!people.length) return false;
  const lastName = p => p.toLowerCase().split(/[^a-z]+/).filter(Boolean)[0] || '';
  const en = people.filter(p => { const ln = lastName(p); return ln && !list.has(ln); }).length;
  return en * 2 >= people.length;
}

// ---------------------------------------------------------------- messages
function weatherText(w, tour, lang) {
  // w = {low, high, snow, rain} or null
  if (tour.winter) {

const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

// ---------------------------------------------------------------- 酒店: read the room list from its screenshot (on the device, Tesseract; library loads on first use)
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('offline')); document.head.appendChild(s); }); }
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
function pixels(im) { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0); return g.getImageData(0, 0, c.width, c.height).data; }
function columnEdges(im) {   // x of the thin vertical grid lines: a line is a sharp colour change on (almost) every row
  const W = im.width, H = im.height, p = pixels(im), lum = i => .3 * p[i] + .59 * p[i + 1] + .11 * p[i + 2], hit = new Array(W).fill(0);
  for (let y = 3; y < H - 3; y++) for (let x = 1; x < W; x++) { const i = (y * W + x) * 4; if (Math.abs(lum(i) - lum(i - 4)) > 10) hit[x]++; }
  const e = []; for (let x = 1; x < W; x++) if (hit[x] > (H - 6) * .85) { if (e.length && x - e[e.length - 1][1] <= 2) e[e.length - 1][1] = x; else e.push([x, x]); }
  return e.map(a => Math.round((a[0] + a[1]) / 2)).filter(x => x > 8 && x < W - 8);   // not the picture's own border
}
function binCrop(im, x0, x1, k) {   // one column, enlarged, black text on white
  const c = document.createElement('canvas'); c.width = Math.round((x1 - x0) * k); c.height = Math.round(im.height * k);
  const g = c.getContext('2d', { willReadFrequently: true }); g.imageSmoothingQuality = 'high'; g.drawImage(im, x0, 0, x1 - x0, im.height, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const v = .3 * p[i] + .59 * p[i + 1] + .11 * p[i + 2] > 150 ? 255 : 0; p[i] = p[i + 1] = p[i + 2] = v; }
  g.putImageData(d, 0, 0); return c;
}
async function ocrImage(Tess, w, src) {   // -> [{day, hotel, code, rooms}] in picture order
  const im = await loadImg(src), b = [0, ...columnEdges(im), im.width];
  if (b.length < 7) throw new Error('layout');
  const wid = b.slice(1).map((x, i) => x - b[i]), widest = wid.indexOf(Math.max(...wid)), last = b.length - 2;
  if (widest < 2 || widest >= last) throw new Error('layout');
  const k = Math.min(5, Math.max(1.5, 3 * 1512 / im.width));
  const read = async (i, wl) => { await w.setParameters({ tessedit_pageseg_mode: '6', tessedit_char_whitelist: wl }); const r = await w.recognize(binCrop(im, b[i] + 3, b[i + 1] - 3, k)); return r.data.lines.map(l => ({ text: l.text.trim(), y: (l.bbox.y0 + l.bbox.y1) / 2 / k })); };
  const rooms = (await read(last, '0123456789')).filter(l => /^\d{1,2}$/.test(l.text)), day = await read(0, '0123456789'),
    code = await read(1, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'), hotel = await read(widest - 1, '');
  if (!rooms.length) throw new Error('layout');
  const gaps = rooms.slice(1).map((l, i) => l.y - rooms[i].y).filter(g => g > 4), tol = Math.max(5, (gaps.length ? Math.min(...gaps) : 30) * .45), at = (arr, y) => arr.find(l => Math.abs(l.y - y) <= tol);
  return rooms.map(l => { const d = at(day, l.y), h = at(hotel, l.y), c = at(code, l.y);
    return { rooms: +l.text, day: d && /^\d$/.test(d.text) ? +d.text : null, code: c ? c.text.toUpperCase().replace(/[^A-Z0-9]/g, '') : '',
      hotel: h ? h.text.replace(/[|_]+/g, '').replace(/\s+[~\-+vV▼]+$/, '').trim() : '' }; }).filter(r => r.hotel);
}
function ocrPick(rows, tour) {   // rows of this tour: a new tour starts when the day number goes back
  const groups = []; let prev = 0;
  rows.forEach(r => { const d = r.day == null ? prev : r.day; if (!groups.length || d < prev) groups.push([]); groups[groups.length - 1].push(Object.assign({}, r, { day: d })); prev = d; });
  const best = groups.map(g => [g.filter(r => r.code.startsWith(tour.code)).length, g]).sort((a, b) => b[0] - a[0])[0];
  return best && (best[0] > 0 || groups.length === 1) ? best[1] : null;
}
async function runHotelOcr() {
  const s = st(), imgs = s.hotelImgs || []; if (!imgs.length || ui.hotelBusy) return;
  ui.hotelBusy = true; render(); let w = null;
  try {
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    w = await Tesseract.createWorker('eng'); let all = [];
    for (const src of imgs) all = all.concat(await ocrImage(Tesseract, w, src));
    const mine = ocrPick(all, D.tour);

    const start = new Date(D.tour.start + 'T12:00:00'), at = n => { const d = new Date(start); d.setDate(d.getDate() + n); return L.ymd(d); };
    const code = D.tour.code + String(start.getMonth() + 1).padStart(2, '0') + String(start.getDate()).padStart(2, '0') + String(start.getFullYear()).slice(2);
    s.hotelRows = mine.map((r, i) => ({ code, guide: '', hotel: r.hotel, remarks: '', rooms: r.rooms, checkin: at(r.day - 1), checkout: at(r.day), ocr: true, idx: i }));

  finally { if (w) try { await w.terminate(); } catch (e) { } ui.hotelBusy = false; render(); }
}

// ---------------------------------------------------------------- contacts file (.vcf)
function contactsVcf() {
  const d = new Date(D.tour.start + 'T12:00:00'), tag = D.tour.code + ' ' + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');

  const out = []; let n = 0;
  D.bookings.forEach(b => b.phones.forEach((p, i) => {
    const who = b.phones.length === b.nameList.length ? b.nameList[i] : (b.nameList[0] || b.names) + (i ? ' ' + (i + 1) : '');
    const name = tag + ' G' + b.group + ' ' + who.replace(/\s+/g, ' ').trim();
    out.push(['BEGIN:VCARD', 'VERSION:3.0', 'N:;' + e(name) + ';;;', 'FN:' + e(name), 'ORG:' + e('Tour ' + tag), 'TEL;TYPE=CELL:' + p, 'NOTE:' + e('第' + b.group + '組 ' + b.pax + '人 ' + b.tour), 'END:VCARD'].join('\r\n'));
    n++;
  }));
  return { text: out.join('\r\n') + '\r\n', n, tag };
}
async function saveContacts() {

function busRows() { return +st().busRows || S.busRows || 14; }

function dayMap(day) { return L.busDayMap(D, busPlan(), day, { rows: busRows(), pinned: st().pinned }); }
function busHTML(day, opts) {
  opts = opts || {};
  const R = busRows(), { map, unseated } = dayMap(day), sh = opts.sh || 34;
  const cols = [0, 1, null, 3, 4], centers = { 0: .5, 1: 1.5, 3: 3, 4: 4 };
  // alternate shading per group along each side
  const shade = {}; let flip = { L: 0, R: 0 };
  for (let r = 1; r <= R; r++) [[0, 'L'], [1, 'L'], [4, 'R'], [3, 'R']].forEach(([c, k]) => { const g = map[r + '-' + c]; if (g !== undefined && shade[g] === undefined) shade[g] = (flip[k]++) % 2 ? 'b' : 'a'; });
  let cells = '';
  for (let r = 1; r <= R; r++) cols.forEach(c => {
    if (c === null) { cells += `<div class="rn">${r}</div>`; return; }
    const k = r + '-' + c, g = map[k];
    if (r === 1 && c === 0) { cells += `<div class="seat" style="font-size:11px">導遊</div>`; return; }
    const cls = ['seat']; if (g !== undefined) cls.push(shade[g]); if (ui.busSel === g && g !== undefined && !opts.print) cls.push('sel'); if (st().pinned[g]) cls.push('pin');
    cells += `<div class="${cls.join(' ')}" ${opts.print ? '' : `data-act="seat" data-g="${g === undefined ? '' : g}"`}>${r === 1 && c === 1 && g === undefined ? '<span style="font-size:10px">空位</span>' : ''}</div>`;
  });
  // one number per block (centre of each connected block)
  const cellsOf = {}; Object.entries(map).forEach(([k, g]) => (cellsOf[g] = cellsOf[g] || []).push(k.split('-').map(Number)));
  let labels = '';
  Object.entries(cellsOf).forEach(([g, cs]) => {
    const left = [], seen = new Set();
    cs.forEach((c, i) => { if (seen.has(i)) return; const comp = [c]; seen.add(i); let grow = true; while (grow) { grow = false; cs.forEach((d, j) => { if (seen.has(j)) return; if (comp.some(a => (a[1] < 2) === (d[1] < 2) && Math.abs(a[0] - d[0]) + Math.abs((a[1] % 3) - (d[1] % 3)) === 1)) { comp.push(d); seen.add(j); grow = true; } }); } left.push(comp); });
    left.forEach(comp => {
      const x = comp.reduce((s, c) => s + centers[c[1]], 0) / comp.length / 4.5 * 100;
      const y = comp.reduce((s, c) => s + c[0] - .5, 0) / comp.length * sh;
      labels += `<div class="lbl" style="left:${x}%;top:${y}px;font-size:${opts.print ? 15 : 20}px">${g}</div>`;
    });
  });
  return { html: `<div class="bus" style="grid-template-columns:1fr 1fr .5fr 1fr 1fr;grid-auto-rows:${sh}px">${cells}${labels}</div>`, unseated, map };
}

function swapGroups(g1, g2) {
  const p = busPlan();
  if (p.spare === g1 || p.spare === g2) {
    const other = p.spare === g1 ? g2 : g1, b = D.bookings.find(x => x.group === other);
    if (b.pax !== 1) { toast('導遊旁邊只有1個位子'); return; }
    for (const k of ['L', 'R']) p[k].forEach(u => { const i = u.indexOf(other); if (i >= 0) u[i] = p.spare; });
    p.spare = other; return true;
  }
  const find = g => { for (const k of ['L', 'R']) { const i = p[k].findIndex(u => u.includes(g)); if (i >= 0) return [k, i]; } return null; };
  const a = find(g1), b = find(g2); if (!a || !b) return;
  const size = g => D.bookings.find(x => x.group === g).pax;
  const ua = p[a[0]][a[1]], ub = p[b[0]][b[1]];
  if (ua === ub) { toast('這兩組已經坐在一起'); return; }
  if (size(g1) === 1 && size(g2) === 1) { ua[ua.indexOf(g1)] = g2; ub[ub.indexOf(g2)] = g1; return true; }
  p[a[0]][a[1]] = ub; p[b[0]][b[1]] = ua;
  const cap = { L: (busRows() - 1) * 2, R: busRows() * 2 };
  const used = k => p[k].reduce((s, u) => s + u.reduce((t, g) => t + size(g), 0), 0);
  if (used('L') > cap.L || used('R') > cap.R) { p[a[0]][a[1]] = ua; p[b[0]][b[1]] = ub; toast('那一邊坐不下，換不了'); return; }
  return true;
}

function tablesFor(half) {

    const t = s.tables[half].map(tb => tb.filter(g => eat.has(g))).filter(tb => tb.length);
    const placed = new Set(t.flat());
    [...eat].filter(g => !placed.has(g)).forEach(g => { if (!t.length) t.push([]); t.sort((a, b) => tableSize(a) - tableSize(b))[0].push(g); });
    return L.sortTables(t);
  }
  return L.restaurantTables(D, s, half);
}

function shrinkImage(file, max) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); }; img.onerror = () => res(null); img.src = r.result; };
    r.onerror = () => res(null); r.readAsDataURL(file);
  });
}

function fitGuestTable() {
  // printable area: letter landscape with 0.25in margins = 10.5in × 8in = 1008 × 768 CSS px
  const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:-99999px;top:0;width:1008px;font-family:var(--body)';
  document.body.appendChild(box);
  const h = (f, l) => { box.innerHTML = guestTable(f, l); return box.firstChild.offsetHeight; };
  const fit = (limit, l) => { let lo = 7, hi = 24; while (hi - lo > .25) { const m = (lo + hi) / 2; if (h(m, l) <= limit) lo = m; else hi = m; } return Math.floor(lo * 4) / 4; };
  const best = limit => [0, 1, 2, 3].map(l => ({ font: fit(limit, l), layout: l })).sort((a, b) => b.font - a.font)[0];
  const one = best(750);
  let res = { pages: 1, font: one.font, layout: one.layout };
  if (one.font < 12) { const two = best(1440); res = { pages: 2, font: two.font, layout: two.layout }; }
  box.remove();
  return res;
}

// build the guest list PDF (letter landscape, 0.25in margins), rows never cut between pages
async function guestPdf() {
  const f = ui.printFit || (ui.printFit = fitGuestTable());
  const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:-99999px;top:0;width:1008px;background:#fff;font-family:var(--body)';
  box.innerHTML = guestTable(f.font, f.layout); document.body.appendChild(box);
  try {
    const t = box.firstChild, top = t.getBoundingClientRect().top;
    const canvas = await html2canvas(t, { scale: 2, backgroundColor: '#ffffff' });
    const pageH = 768, cuts = [0]; let start = 0;
    [...t.rows].forEach(r => { const rt = r.getBoundingClientRect(), y0 = rt.top - top, y1 = rt.bottom - top; if (y1 - start > pageH && y0 > start) { cuts.push(y0); start = y0; } });
    cuts.push(t.offsetHeight);
    const pdf = new jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
    for (let i = 0; i + 1 < cuts.length; i++) {
      const h = cuts[i + 1] - cuts[i], c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.ceil(h * 2);
      c.getContext('2d').drawImage(canvas, 0, Math.floor(cuts[i] * 2), canvas.width, c.height, 0, 0, canvas.width, c.height);
      if (i) pdf.addPage('letter', 'landscape');
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 18, 18, 756, h * 0.75);
    }
    return new File([pdf.output('blob')], D.tour.code + '-' + D.tour.start + '-guest-list.pdf', { type: 'application/pdf' });
  } finally { box.remove(); }
}

      for (const n of wb.SheetNames) { const r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }); try { const h = L.readHotelList(r); if (L.hotelCheck(D, h, {}).found || !rows) rows = h; if (L.hotelCheck(D, h, {}).found) break; } catch (e) { } }
      if (!rows) throw new Error('找不到表頭（Hotel Name / Finalized Room）');
      st().hotelRows = rows; st().hotelFile = el.files[0].name; save(); render();
    } catch (err) { toast('讀不到房間表: ' + err.message); }
    return;
  }
  if (el.id === 'restoreIn' && el.files[0]) {
    try {
      const all = JSON.parse(await el.files[0].text());
      if (all.settings) { S = mergeSettings(all.settings); await saveSettings(); }
      for (const t of all.tours || []) { await put('tour:' + t.id, t); if (!tours.some(x => x.id === t.id)) tours.push({ id: t.id, label: t.id, savedAt: Date.now() }); }
      await put('tours', tours); toast('備份已載入'); render();
    } catch (err) { toast('備份檔有問題'); }
    return;
  }
  if (el.dataset.act === 'busRowsSel') { st().busRows = +el.value; st().busPlan = null; save(); render(); return; }
  if (el.dataset.act === 'driving') { st().driving = el.checked; save(); render(); return; }
  if (el.dataset.hotelimg) {
    if (!D) { el.value = ''; toast('請先載入客人名單'); return; }
    const s = st(); s.hotelImgs = el.dataset.hotelimg === 'replace' ? [] : (s.hotelImgs || []);
    for (const f of el.files) { const src = await shrinkImage(f, 2400); if (src) s.hotelImgs.push(src); }
    tab = 'hotel'; save(); render(); window.scrollTo(0, 0); runHotelOcr(); return;
  }
  if (el.dataset.hrow !== undefined) { const r = st().hotelRows[+el.dataset.hrow]; if (r) { r.rooms = Math.max(0, +el.value || 0); save(); render(); } return; }
  if (el.dataset.receipt) {
    const k = el.dataset.receipt, s = st();
    for (const f of el.files) { const src = await shrinkImage(f, 1600); if (src) (s.receipts[k] = s.receipts[k] || []).push(src); }
    save(); render(); return;
  }
  if (el.dataset.review) {
    const r = st().reviews[el.dataset.review] = st().reviews[el.dataset.review] || {}; r.photos = r.photos || [];
    for (const f of el.files) { const src = await shrinkImage(f, 1600); if (src) r.photos.push(src); }
    r.done = true; save(); render(); return;
  }
  if (el.dataset.bind) {
    const p = el.dataset.bind;
    let v = el.value; if (el.type === 'number') v = v === '' ? '' : +v;
    if (p.startsWith('report.pax.')) { st().report.pax[p.slice(11)] = v; }
    else if (p.startsWith('report.rate.')) { st().report.rate = st().report.rate || {}; st().report.rate[p.slice(12)] = v; }
    else if (p.startsWith('payments.')) { const [, g, , key] = p.split('.'); const pp = st().payments[g] = st().payments[g] || {}; pp.price = pp.price || {}; pp.price[key] = v; }
    else setPath(st(), p, v);
    save(); render(); return;
  }
  if (el.dataset.set) {
    let v = el.value; if (el.type === 'number') v = +v;
    S[el.dataset.set] = v; await saveSettings(); toast('已儲存'); if (D) render();
  }
});
setInterval(() => { if (tab === 'sms' && D && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);

// ---------------------------------------------------------------- start
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });   // offline + "Add to Home Screen"
(async function start() {
  S = mergeSettings(await get('settings'));
  tours = (await get('tours')) || [];
  const cur = await get('current');
  if (cur) await openTour(cur); else render();
  await initCloud(); await initDrive(); if (tab === 'set') render();
})();
})();

</script>
